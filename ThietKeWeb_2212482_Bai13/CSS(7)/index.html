<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* bai tap 1 */
        .em{ font-size: 1.5em ;
            font-weight: bold;  /** Độ đậm của chữ**/
            font-style: italic;  /** kiểu chữ nghiêng**/
            font-variant: normal; /** Chữ hoa đặc biệt**/
            color: #669} /**Định dạng màu chữ**/
        .rem{font-size: 1.5rem ;
            font-weight: bolder;
            font-style: oblique;
            font-variant: small-caps;
            color: blueviolet;}
        .px{font-size: 69px;
            font-weight: lighter;}
        .percent{font-size: 175%;
            font-weight: 200;}
    </style>
</head>
<body>
    <h1 class="em"> Đơn vị đo kích thước tương đối em</h1>
    <h1 class="rem"> Đơn vị đo kích thước tương đối rem</h1>
    <p class="px"> Đơn vị đo kích thước tuyệt đối px</p>
    <h1 class="percent">Giá trị %</h1>
</body>
</html>
